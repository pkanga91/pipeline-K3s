apiVersion: apps/v1
kind: Deployment
metadata:
  name: myweb-application
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myweb-application
  template:
    metadata:
      labels:
        app: myweb-application
    spec:
      containers:
        - name: web
          image: nginx:alpine
          ports:
            - containerPort: 80
